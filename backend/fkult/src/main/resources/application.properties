spring.application.name=fkult

# SQLite database file
spring.datasource.url=jdbc:sqlite:database/F-Kult.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Run schema.sql on every startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# If you have seed data, uncomment:
# spring.sql.init.data-locations=classpath:data.sql

# Ensure every pooled connection enforces foreign keys
spring.datasource.hikari.connectionInitSql=PRAGMA foreign_keys=ON;

# File upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# nvironment variables
stregsystem.base-url=${STREGSYSTEM_BASE_URL}
cors.address=${CORS_ADDRESS}