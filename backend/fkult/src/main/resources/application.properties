# Tell Spring Boot to run the SQL scripts in resources
#spring.datasource.initialization-mode=embedded
#spring.sql.init.schema-locations=classpath:schema.sql
#spring.sql.init.data-locations=classpath:data.sql

spring.application.name=fkult

# SQLite database file
spring.datasource.url=jdbc:sqlite:database/F-Kult.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Run schema.sql on every startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# If you have seed data, uncomment:
# spring.sql.init.data-locations=classpath:data.sql

# Ensure every pooled connection enforces foreign keys
spring.datasource.hikari.connectionInitSql=PRAGMA foreign_keys=ON;

# File upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
# Login happens either through F-Klub SSO (OIDC, the normal way for members) or
# through the admin account (username + password, no SSO needed).

# Where the frontend lives; the OIDC callback sends the browser back here
fkult.frontend-url=${FKULT_FRONTEND_URL:http://localhost:5173}

# Origins allowed to call the API. The session cookie is sent along, so this list
# has to stay explicit instead of "*".
fkult.cors.allowed-origins=${FKULT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# F-Klub SSO / OIDC client registration (credentials from the stregsystem TREO)
spring.security.oauth2.client.registration.fklub.provider=fklub
spring.security.oauth2.client.registration.fklub.client-id=${FKULT_OIDC_CLIENT_ID:w7FzpHaakGAuDxqvCUAlRD7Hrw2bIOs2NoUKiQtu}
spring.security.oauth2.client.registration.fklub.client-secret=${FKULT_OIDC_CLIENT_SECRET:mywmio4js9jUTlw5BT8o4xEdNPXhgGWBkcfnISCUWH1SeE8gSeSouTJEZBYOteuCKpVFwcy8N38uVN6CNf7oNY6OhJxm0dQt78fnsksaZWNKcPCbzbY1MzfxnUwNzXLi}
spring.security.oauth2.client.registration.fklub.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.fklub.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.fklub.scope=openid,profile
spring.security.oauth2.client.registration.fklub.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.fklub.client-name=F-Klub SSO

# The provider endpoints are configured explicitly (instead of issuer-uri) so the
# backend still boots when the stregsystem is unreachable.
spring.security.oauth2.client.provider.fklub.authorization-uri=${FKULT_OIDC_AUTHORIZE_URI:https://stregsystem.fklub.dk/o/authorize/}
spring.security.oauth2.client.provider.fklub.token-uri=${FKULT_OIDC_TOKEN_URI:https://stregsystem.fklub.dk/o/token/}
spring.security.oauth2.client.provider.fklub.jwk-set-uri=${FKULT_OIDC_JWKS_URI:https://stregsystem.fklub.dk/o/.well-known/jwks.json}
spring.security.oauth2.client.provider.fklub.user-info-uri=${FKULT_OIDC_USERINFO_URI:https://stregsystem.fklub.dk/o/userinfo/}
spring.security.oauth2.client.provider.fklub.user-name-attribute=username

# Break-glass admin account. password-hash uses Spring's {id} prefix notation,
# e.g. {bcrypt}$2a$10$...  Generate one with:
#   htpasswd -bnBC 10 "" 'your-password' | tr -d ':\n'
fkult.admin.username=${FKULT_ADMIN_USERNAME:root}
fkult.admin.password-hash=${FKULT_ADMIN_PASSWORD_HASH:{noop}admin}

# Session cookie. SameSite=Lax also blocks cross-site form posts, which is why the
# CSRF token can be left out for this JSON API.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

