spring.application.name=fkult

# SQLite database file
spring.datasource.url=jdbc:sqlite:database/F-Kult.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Run schema.sql on every startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# If you have seed data, uncomment:
# spring.sql.init.data-locations=classpath:data.sql

# Ensure every pooled connection enforces foreign keys
spring.datasource.hikari.connectionInitSql=PRAGMA foreign_keys=ON;

# File upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# TMDb API
tmdb.api.read-token=${TMDB_API_READ_TOKEN}
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.image.base-url=https://image.tmdb.org/t/p/w500

# TMDb Import
tmdb.import.batch-size=100
tmdb.import.max-movies-per-run=100
tmdb.import.request-delay-ms=500

# Scheduler
tmdb.import.scheduler-delay-ms=60000
tmdb.import.initial-delay-ms=60000